<mat-dialog-content class="fullscreen-dialog-content">
    @if (isPdf) {
    <object [data]="safeAssetUrl" type="application/pdf" class="preview-element pdf-viewer">
        <div class="pdf-fallback">
            <p>Unable to preview PDF directly.</p>
            <a [href]="assetUrl" target="_blank" mat-flat-button color="primary">Download PDF</a>
        </div>
    </object>
    } @else {
    <img [src]="safeAssetUrl" [alt]="data?.title || 'Certificate preview'" class="preview-element image-preview" />
    }
</mat-dialog-content>
